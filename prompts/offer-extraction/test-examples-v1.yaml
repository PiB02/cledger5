validation_scenarios:
  # SCÉNARIOS DE VALIDATION
  
  reject_cases:
    # Cas qui doivent être rejetés (confidence < 0.80)
    - "Offre trop vague sans compétences claires"
    - "Description de 2 lignes sans détails"
    - "Titre générique type 'Assistant polyvalent'"
    - "Offre avec informations contradictoires"
    
  edge_cases:
    # Cas limites à tester
    - "Offre multilingue (français/anglais mélangé)"
    - "Startups avec vocabulaire non-standard" 
    - "Secteur public avec grilles spécifiques"
    - "Freelance/consultant vs salarié"
    - "Offre avec skills très spécialisées/niches"
    
  performance_targets:
    # Objectifs de performance
    extraction_time_max: "2s p95"
    cost_per_offer_max: "$0.001" 
    success_rate_min: "85%"  # offers avec confidence ≥ 0.80
    json_valid_rate_min: "98%"

prompt_testing_strategy: |
  ## STRATÉGIE DE TEST DES PROMPTS

  ### 1. TESTS UNITAIRES
  - 1 prompt = 1 responsabilité (skills, seniority, etc.)
  - Test chaque cas edge individuellement
  - Mesurer confidence scores précisément

  ### 2. TESTS D'INTÉGRATION  
  - Pipeline complet sur échantillon représentatif
  - Validation JSON schema end-to-end
  - Test rate limiting et error handling

  ### 3. TESTS DE RÉGRESSION
  - Benchmark sur dataset de référence
  - Comparaison versions prompts (A/B testing)
  - Monitoring dérive de performance

  ### 4. TESTS DE CHARGE
  - Batch processing 1000+ offres
  - Stress test avec timeouts/retries
  - Validation coûts dans budget